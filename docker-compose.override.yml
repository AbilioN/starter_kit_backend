version: '3.8'

services:
  app:
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    # See the note on `app` in docker-compose.yml: the image CMD (php-fpm) is
    # kept so requests are handled concurrently instead of one at a time.

  webserver:
    ports:
      - "8006:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/

  db:
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: starter_kit_backend
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
      MYSQL_USER: starter_kit_backend

  redis:
    ports:
      - "6379:6379"

  horizon:
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  # The whole source tree, .env included. The base file mounts named subpaths
  # (./app, ./config, ...) which deliberately leave .env out, so without this
  # entry the scheduler runs current CODE against the ENV baked into the image
  # at build time. That skew is silent and it bites hardest here, because this
  # is the container that runs the backups and sends the alerts: between
  # 2026-08-21 and 2026-08-28 every scheduled backup died on an empty
  # BACKUP_ENCRYPTION_KEY, and the alerting that should have said so had no
  # ALERT_* variables either. Keep this in step with `horizon` above.
  scheduler:
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  openai-listener:
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true