server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Proxy para o servidor de desenvolvimento do Laravel
    location / {
        proxy_pass http://app:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Named location so the static-asset fallback below can proxy through
    # to the app on a cache miss, instead of the previous behavior of
    # returning a hard 404 - which incorrectly ate dynamically-served
    # "files" like Livewire's /livewire-*/livewire.js (not a real file on
    # disk) and broke Livewire's JS from ever loading.
    location @app {
        proxy_pass http://app:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback para arquivos estáticos - serve directly if the file exists
    # on disk, otherwise falls through to the app (see @app above).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @app;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
} 