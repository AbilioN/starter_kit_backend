server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # This used to be `proxy_pass http://app:9000` in front of
    # `php artisan serve`. That is PHP's built-in development server, which
    # serves exactly ONE request at a time (PHP_CLI_SERVER_WORKERS is ignored
    # without `--no-reload`), so every concurrent call queued behind whatever
    # was already running - measured at 8 parallel logins taking 8.6x a single
    # one. The image is `php:8.2-fpm` and its own CMD is `php-fpm`, so talking
    # FastCGI to it gives real multi-process concurrency with no extra
    # dependency. The `command:` override that forced `artisan serve` was
    # removed from docker-compose.yml and docker-compose.override.yml.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Long enough for a slow first-request autoload/AI call; the default
        # 60s is short for local dev with an unwarmed opcache.
        fastcgi_read_timeout 300;
    }

    # Static assets are served straight off disk. The fallback to index.php
    # matters for dynamically-served "files" that are not on disk - Livewire's
    # /livewire-*/livewire.js is the one that bit us before, so keep it.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
