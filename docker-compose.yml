version: '3.8'

services:
  # Serviço da aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter_kit_backend_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./artisan:/var/www/artisan
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./package.json:/var/www/package.json
      - ./package-lock.json:/var/www/package-lock.json
      - ./vite.config.js:/var/www/vite.config.js
      - vendor_data:/var/www/vendor
      # SQLite only for PHPUnit (container volume, not host)
      - sqlite_data:/var/www/storage/app/sqlite
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - vendor_data:/var/www/vendor
    networks:
      - starter_kit_backend_network
    depends_on:
      - db
      - redis
    # No `command:` on purpose - the image's own CMD is `php-fpm`, which is
    # multi-process. Overriding it with `php artisan serve` (PHP's built-in
    # dev server) serialised every request onto a single worker; nginx now
    # talks FastCGI to this container instead. See docker/nginx/conf.d/app.conf.

  # Servidor web Nginx
  webserver:
    image: nginx:alpine
    container_name: starter_kit_backend_nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - starter_kit_backend_network
    depends_on:
      - app

  # Banco de dados MySQL
  db:
    image: mysql:8.0
    container_name: starter_kit_backend_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-starter_kit_backend}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-starter_kit_backend}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - starter_kit_backend_network

  # Redis para cache e sessões
  redis:
    image: redis:alpine
    container_name: starter_kit_backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - starter_kit_backend_network

  # Horizon — unified queue dashboard (replaces queue_messages + queue_events)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter_kit_backend_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./artisan:/var/www/artisan
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./package.json:/var/www/package.json
      - ./package-lock.json:/var/www/package-lock.json
      - ./vite.config.js:/var/www/vite.config.js
      - vendor_data:/var/www/vendor
    networks:
      - starter_kit_backend_network
    depends_on:
      - db
      - redis
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_DATABASE=${DB_DATABASE:-starter_kit_backend}
      - DB_USERNAME=${DB_USERNAME:-starter_kit_backend}
    command: ./docker/wait-for-db.sh php artisan horizon

  # Consumes openai_responses from Redis (pushed by the starter_kit_ai_microservice
  # Python worker) and dispatches ProcessOpenAIResponse for each one.
  openai-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter_kit_backend_openai_listener
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./app:/var/www/app
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./bootstrap:/var/www/bootstrap
      - ./artisan:/var/www/artisan
      - ./composer.json:/var/www/composer.json
      - ./composer.lock:/var/www/composer.lock
      - ./package.json:/var/www/package.json
      - ./package-lock.json:/var/www/package-lock.json
      - ./vite.config.js:/var/www/vite.config.js
      - vendor_data:/var/www/vendor
    networks:
      - starter_kit_backend_network
    depends_on:
      - db
      - redis
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_DATABASE=${DB_DATABASE:-starter_kit_backend}
      - DB_USERNAME=${DB_USERNAME:-starter_kit_backend}
    command: ./docker/wait-for-db.sh php artisan listen:openai-responses

networks:
  starter_kit_backend_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  vendor_data:
    driver: local 
  sqlite_data:
    driver: local